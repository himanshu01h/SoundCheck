<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCheck - Sign Up</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-serif-title {
            font-family: 'Playfair Display', Georgia, serif;
        }
        /* Custom scrollbar and smooth rendering */
        * {
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden flex items-center justify-center lg:justify-end lg:pr-20">

    <!-- Background Image container -->
    <div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('image_c4b1fa.png');">
        <!-- Optional subtle dark overlay for depth if needed -->
        <div class="absolute inset-0 bg-black/10"></div>
    </div>

    <!-- Card Container positioned on the middle-right -->
    <div class="relative z-10 w-full max-w-[440px] mx-4 sm:mx-auto lg:mx-0 bg-white rounded-2xl shadow-2xl p-8 sm:p-10 flex flex-col justify-between max-h-[90vh] overflow-y-auto">
        
        <!-- Header Section -->
        <div class="mb-6">
            <h1 class="font-serif-title text-3xl font-bold text-neutral-900 mb-1.5 tracking-tight">SoundCheck</h1>
            <p class="text-xs sm:text-sm text-neutral-500 font-medium">You are few moments away from getting started!</p>
        </div>

        <!-- Form Start -->
        <form class="space-y-4" onsubmit="event.preventDefault(); handleSubmit();">
            
            <!-- Checkbox option -->
            <div class="flex items-center space-x-3 pt-1 pb-1">
                <input type="checkbox" id="tips" checked class="w-4 h-4 text-neutral-900 border-neutral-300 rounded focus:ring-black accent-black cursor-pointer">
                <label for="tips" class="text-xs text-neutral-800 font-medium cursor-pointer select-none">Send me tips, updates and offers</label>
            </div>

            <!-- Email Field -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-neutral-900 uppercase tracking-wider">Email</label>
                <input type="email" id="email" required autocomplete="email" placeholder="Enter your email" class="w-full px-4 py-3 text-sm bg-white border border-neutral-200 rounded-xl focus:outline-none focus:border-black transition-colors placeholder:text-neutral-400 text-neutral-800">
            </div>

            <!-- Password Field -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-neutral-900 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <input type="password" id="password" required minlength="6" autocomplete="current-password" placeholder="••••••••••" class="w-full px-4 py-3 text-sm bg-white border border-neutral-200 rounded-xl focus:outline-none focus:border-black transition-colors placeholder:text-neutral-400 text-neutral-800 pr-10">
                    <button type="button" onclick="togglePassword(this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-600 focus:outline-none">
                        <!-- Eye Slash Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Terms Text -->
            <p class="text-[11px] text-neutral-500 leading-relaxed pt-1">
                By signing up, you accept SoundCheck <a href="#" class="font-semibold text-neutral-800 underline hover:text-black">privacy policy</a> and <a href="#" class="font-semibold text-neutral-800 underline hover:text-black">terms of service</a>.
            </p>

            <!-- Primary Sign Up Button -->
            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-neutral-900 hover:bg-black text-white font-medium text-sm rounded-xl transition-all shadow-md hover:shadow-lg active:scale-[0.99] mt-2">
                Sign up
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex py-4 items-center">
            <div class="flex-grow border-t border-neutral-200"></div>
            <span class="flex-shrink mx-4 text-xs text-neutral-400 font-medium">or</span>
            <div class="flex-grow border-t border-neutral-200"></div>
        </div>

        <!-- Social Login Buttons -->
        <div class="space-y-3">
            <button type="button" onclick="handleSocial('Google')" class="w-full flex items-center justify-center py-3 px-4 border border-neutral-200 rounded-xl hover:bg-neutral-50 transition-colors text-sm font-medium text-neutral-700 shadow-sm">
                <svg class="w-4 h-4 mr-2.5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.25 21.32 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.17 0 9.99 0 12s.45 3.83 1.24 5.42l4.04-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.68 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                Continue with Google
            </button>
        </div>

        <!-- Footer Link -->
        <div class="text-center pt-6">
            <p class="text-xs text-neutral-500">
                <span id="modeText">Already have an account?</span> <a href="#" id="modeLink" onclick="toggleMode(event)" class="font-bold text-neutral-900 hover:underline">Log In</a>
            </p>
        </div>

    </div>

    <!-- Custom Toast Notification Box (Replaces alert) -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-neutral-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3 text-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="toast-message">Sign up action simulated successfully!</span>
    </div>

    <script>
        const APP_URL = 'soundcheck_complete_platform.html#explore';
        const KEY_USERS = 'sc_users', KEY_SESSION = 'sc_session', KEY_PROFILE = 'sc_profile';
        let mode = 'signup';   // 'signup' | 'login'

        const read = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
        const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

        // Already signed in? Skip straight to the app.
        if (read(KEY_SESSION, null)) location.replace(APP_URL);

        async function hashPassword(pw) {
            const text = 'soundcheck:' + pw;
            if (window.crypto && crypto.subtle) {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            }
            return btoa(unescape(encodeURIComponent(text)));
        }

        function setMode(m) {
            mode = m;
            document.getElementById('submitBtn').textContent = m === 'login' ? 'Log in' : 'Sign up';
            document.getElementById('modeText').textContent = m === 'login' ? "Don't have an account?" : 'Already have an account?';
            document.getElementById('modeLink').textContent = m === 'login' ? 'Sign up' : 'Log In';
            document.getElementById('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
        }
        function toggleMode(e) { e.preventDefault(); setMode(mode === 'login' ? 'signup' : 'login'); }

        async function handleSubmit() {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const pw = document.getElementById('password').value;
            if (pw.length < 6) { showCustomToast('Password must be at least 6 characters'); return; }

            const users = read(KEY_USERS, {});
            const hash = await hashPassword(pw);

            if (mode === 'login') {
                if (!users[email]) { showCustomToast('No account found for this email. Please sign up first.'); return; }
                if (users[email].hash !== hash) { showCustomToast('Incorrect password. Please try again.'); return; }
            } else {
                if (users[email]) { setMode('login'); showCustomToast('This email already has an account. Please log in.'); return; }
                users[email] = { hash, tips: document.getElementById('tips').checked, created: Date.now() };
                if (!write(KEY_USERS, users)) { showCustomToast('Could not save your account (browser storage is blocked).'); return; }
            }

            write(KEY_SESSION, { email, at: Date.now() });
            // Show the right name/email in the app's Settings page
            const profile = read(KEY_PROFILE, null);
            if (!profile || profile.email !== email) write(KEY_PROFILE, { username: email.split('@')[0], email, phone: '' });

            showToast(mode === 'login' ? 'Welcome back! Opening SoundCheck...' : 'Account successfully created for SoundCheck!');
            setTimeout(() => { location.href = APP_URL; }, 900);
        }

        function togglePassword(btn) {
            const input = btn.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        function handleSocial(provider) {
            showCustomToast(provider + ' sign-in is not set up yet. Please use email and password.');
        }

        function showToast(msg) {
            showCustomToast(msg);
        }

        let toastTimer;
        function showCustomToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            msgEl.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }
    </script>
</body>
</html>
